appId: br.com.mhvtech.trincamania
name: Abrir o app do zero e entrar na primeira fase
---
# O caminho mais curto entre "instalei" e "estou jogando". Nenhuma das outras
# camadas de teste responde se ele funciona: os testes de componente montam a
# tela em memória, sem app, sem navegação e sem save de verdade.
- launchApp:
    clearState: true

# A abertura é animada e a duração dela não é contrato de nada. Esperar pelo
# botão de pular, e não por um tempo fixo, é o que impede o fluxo de virar
# refém do ritmo da animação.
- extendedWaitUntil:
    visible:
      id: 'splash-skip'
    timeout: 40000
- tapOn:
    id: 'splash-skip'

# Save em branco abre o guia da campanha por cima do mapa
# (`setIsTutorialVisible(!tutorialSeen)` no App.tsx) — nada atrás dele é
# tocável enquanto estiver aberto. `optional` porque o guia só aparece uma vez
# na vida do save: numa reexecução sem `clearState` ele não vem, e isso não é
# falha.
- tapOn:
    id: 'tutorial-pular'
    optional: true

# O mapa é mais alto que a tela e a fase 1 fica no pé dele; a `ScrollView` usa
# `removeClippedSubviews`, então nó fora da viewport nem existe na hierarquia
# nativa — procurar por ele sem rolar não acha nada. A tela rola sozinha até a
# fase atual ao abrir, mas depender disso deixaria o fluxo refém de uma corrida
# de layout. `scrollUntilVisible` funciona nos dois casos: se já rolou, acha de
# primeira.
- scrollUntilVisible:
    element:
      id: 'map-level-w1-001'
    direction: DOWN
    timeout: 30000

- tapOn:
    id: 'map-level-w1-001'

- extendedWaitUntil:
    visible:
      id: 'jogar-fase'
    timeout: 10000
- tapOn:
    id: 'jogar-fase'

# A primeira fase de um save em branco abre o tutorial prático por cima do
# tabuleiro — o tabuleiro está lá atrás, mas coberto, e é assim que o Maestro
# (com razão) o relata. `optional` pela mesma razão do guia do mapa: ele só
# aparece uma vez na vida do save.
- tapOn:
    id: 'tutorial-pratico-avancar'
    optional: true

# `extendedWaitUntil` já é a asserção, não só uma espera: se o tabuleiro não
# aparecer dentro do prazo, o fluxo falha aqui.
- extendedWaitUntil:
    visible:
      id: 'game-board'
    timeout: 30000
