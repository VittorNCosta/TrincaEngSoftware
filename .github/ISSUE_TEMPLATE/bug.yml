name: Bug
description: Algo nao funciona como deveria
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: O que voce esperava, e o que aconteceu de fato.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passo a passo para reproduzir
      placeholder: |
        1. Abra o app e va para...
        2. Toque em...
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versao ou commit
      description: "`package.json` (versao) ou o hash do commit, se souber."
    validations:
      required: false
  - type: dropdown
    id: plataforma
    attributes:
      label: Plataforma
      multiple: true
      options:
        - Android
        - iOS
        - Web (expo start --web)
    validations:
      required: false
