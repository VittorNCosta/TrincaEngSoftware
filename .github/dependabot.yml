# Atualizacao automatica de dependencia (SEC-04).
#
# O motivo de existir esta a um `git log` de distancia: o commit "chore:
# corrige vulnerabilidades" subiu `@types/jest` para `^30.0.0` a mao e deixou o
# `package-lock.json` em `29.5.14`. `npm ci` passou a morrer com EUSAGE e o CI
# de `develop` ficou vermelho por dias. O Dependabot nao comete esse erro:
# manifesto e lock saem sempre no mesmo commit.
version: 2

updates:
  - package-ecosystem: npm
    # O projeto nao fica na raiz do repositorio. O caminho tem espaco e o
    # Dependabot aceita — precisa ser exatamente este.
    directory: "/TrincaMania Redesign/TrincaMania-ODS12"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # O commitlint deste repositorio exige Conventional Commits com escopo
    # dentro de um enum fechado; `deps` esta nele. Sem isto todo PR do
    # Dependabot nasceria com a mensagem reprovada pelo hook.
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Um PR por semana com todo minor/patch junto, em vez de oito PRs
      # separados que ninguem revisa. Major continua vindo sozinho, porque e o
      # unico que costuma quebrar alguma coisa.
      producao:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Quem manda na versao destes e o Expo SDK, via `expo install` e o
      # `jest-expo` correspondente — nao o registro do npm. Um major solto aqui
      # quebra o app de um jeito que so aparece no aparelho.
      #
      # Foi exatamente o que aconteceu com `@types/jest`: subir para 30 com
      # `jest` em `~29.7.0` (fixado pelo `jest-expo` 54) trouxe metade do jest
      # 30 como dependencia transitiva. Subir o SDK do Expo e tarefa de
      # roadmap, com teste de aparelho — nao PR automatico.
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: expo-*
        update-types: [version-update:semver-major]
      # Expo SDK 54 fixa estas versoes; avancos automaticos ja quebraram o
      # expo-doctor em develop. Atualizar junto com o proximo SDK.
      - dependency-name: eslint-config-expo
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-svg
      # Expo SDK 54 requer @sentry/react-native ~7.2.0; a PR #280 com 8.27.0
      # falhou no expo-doctor. Reavaliar junto com a migracao do SDK.
      - dependency-name: "@sentry/react-native"
        update-types: [version-update:semver-major]
      # eslint-config-expo 10 ainda usa APIs removidas no ESLint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      # A versao do renderer deve acompanhar exatamente o React resolvido pelo
      # Expo SDK. Atualiza-lo sozinho causa conflito de peer dependency no CI.
      - dependency-name: react-test-renderer
      - dependency-name: react-native-*
        update-types: [version-update:semver-major]
      # O major 3 usa entrypoint ESM que os testes CommonJS com Node 20 nao
      # conseguem carregar. Migrar os testes deve acompanhar esse upgrade.
      - dependency-name: "@react-native-async-storage/async-storage"
        update-types: [version-update:semver-major]
      # A versao 14 troca react-test-renderer por outro renderer e torna render()
      # assincrono. Os testes ainda usam a API 13 junto ao Expo SDK 54.
      - dependency-name: "@testing-library/react-native"
        update-types: [version-update:semver-major]
      - dependency-name: jest
      - dependency-name: jest-expo
      - dependency-name: "@types/jest"
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # As proprias actions dos workflows. Estao pinadas por SHA, que e o certo
  # para seguranca e o pior para manutencao: SHA nao envelhece visivelmente, e
  # um dia o runner deixa de suportar a versao do Node embutida nela — foi o
  # aviso de deprecacao que apareceu nas actions v4 deste repositorio.
  # O Dependabot le o comentario `# v7.0.1` ao lado do SHA e sobe os dois.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
