name: Orcamento Actions

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  verificar:
    name: Limite mensal de minutos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verificar limite de 90% de 2.000 minutos
        run: node scripts/actions-budget.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONS_BUDGET_FLOOR: ${{ vars.ACTIONS_BUDGET_FLOOR }}
