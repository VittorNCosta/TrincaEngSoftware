name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes seguidos nao podem recalcular o mesmo PR de release ao mesmo
# tempo — o segundo veria o estado do primeiro pela metade.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    name: PR de release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `contents: write` cria a tag e o release; `pull-requests: write` abre e
      # atualiza o PR de release. Sao as duas unicas escritas de todo o
      # repositorio, e ficam confinadas a este job.
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
      release_created: ${{ steps.release.outputs['TrincaMania Redesign/TrincaMania-ODS12--release_created'] }}
      tag_name: ${{ steps.release.outputs['TrincaMania Redesign/TrincaMania-ODS12--tag_name'] }}

      sha: ${{ steps.release.outputs['TrincaMania Redesign/TrincaMania-ODS12--sha'] }}

  sbom:
    name: SBOM da release
    needs: release-please
    # A maioria dos pushes em develop so atualiza o PR de release (junta mais
    # um commit na proxima versao proposta) sem criar release nenhum. Sem este
    # `if`, o job rodaria a cada push e falharia tentando publicar SBOM num
    # release que nao existe.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `gh release upload` precisa de escrita no release. E a unica escrita
      # deste job — nao toca em PR nem em outro conteudo do repositorio.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: "TrincaMania Redesign/TrincaMania-ODS12/package-lock.json"
      - run: npm ci
        working-directory: "TrincaMania Redesign/TrincaMania-ODS12"
      # SBOM (Software Bill of Materials) em CycloneDX, gerado a partir do
      # package-lock.json: inventario auditavel de toda dependencia (direta e
      # transitiva) que compoe a build desta versao (SEC-09). `npx --yes`
      # porque o job nunca reusa cache de node_modules entre execucoes — sem
      # isso o npx pausaria pedindo confirmacao interativa.
      - name: Gerar o SBOM
        working-directory: "TrincaMania Redesign/TrincaMania-ODS12"
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file ../../sbom.cdx.json
      - name: Publicar no release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" sbom.cdx.json --clobber

  build:
    name: Build da release
    needs: [release-please, sbom]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      sha: ${{ needs.release-please.outputs.sha }}
      tag: ${{ needs.release-please.outputs.tag_name }}
      perfil: production
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  rastreabilidade:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/rastreabilidade.yml
    with:
      pr_number: ${{ matrix.pr.number }}
