name: CI

on:
  push:
    branches: ["**"]
  pull_request: {}

defaults:
  run:
    working-directory: "TrincaMania Redesign/TrincaMania-ODS12"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "TrincaMania Redesign/TrincaMania-ODS12/package-lock.json"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:ui

      - run: npm run test:playthrough
