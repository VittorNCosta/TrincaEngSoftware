name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: "TrincaMania Redesign/TrincaMania-ODS12"

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "TrincaMania Redesign/TrincaMania-ODS12/package-lock.json"

      - run: npm ci

      - run: npm run lint

      # Guardas de conteudo. Comparam com um livro-razao versionado
      # (scripts/*-baseline.json) em vez de reprovar no saldo atual, que e
      # divida conhecida com tarefa no roadmap.
      - run: npm run guarda:ods12

      - run: npm run valida:assets

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:ui

      - run: npm run test:playthrough
