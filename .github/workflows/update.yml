name: EAS Update
on:
  workflow_dispatch:
    inputs:
      canal:
        description: Canal do binário instalado
        type: choice
        options: [preview, production]
        required: true
      sha:
        description: Commit completo aprovado para publicação
        type: string
        required: true
      publicar:
        description: Confirmo a publicação OTA neste canal
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ota-${{ inputs.canal }}
  cancel-in-progress: false
jobs:
  update:
    name: Publicar atualização aprovada
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: updates-${{ inputs.canal }}
    defaults:
      run:
        working-directory: "TrincaMania Redesign/TrincaMania-ODS12"
    steps:
      - name: Verificar publicação e credencial
        working-directory: .
        env:
          PUBLICAR: ${{ inputs.publicar }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT: ${{ inputs.sha }}
        run: |
          test "$PUBLICAR" = true || { echo 'Publicação não confirmada'; exit 1; }
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN ausente'; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA completo obrigatório'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: "TrincaMania Redesign/TrincaMania-ODS12/package-lock.json"
      - run: npm ci
      - name: Publicar JS e sourcemaps
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          UPDATE_CHANNEL: ${{ inputs.canal }}
          UPDATE_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$EXPO_PUBLIC_SENTRY_DSN" ]; then
            test -n "$SENTRY_AUTH_TOKEN" && test -n "$SENTRY_ORG" && test -n "$SENTRY_PROJECT" || exit 1
          fi
          npx --yes eas-cli@16.32.0 update --channel "$UPDATE_CHANNEL" --environment "$UPDATE_CHANNEL" --platform android --message "$UPDATE_SHA" --non-interactive
          if [ -n "$EXPO_PUBLIC_SENTRY_DSN" ]; then
            npx --no-install sentry-expo-upload-sourcemaps dist
          fi
